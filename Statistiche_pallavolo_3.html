<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conteggio Errori Pallavolo</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f4f4;margin:15px;text-align:center}h1{color:#333}.info-partita{max-width:1000px;margin:0 auto 20px;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.15);display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.campo{display:flex;flex-direction:column;text-align:left}.campo input{padding:10px}.container{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:auto}.counter{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:240px}.value{font-size:56px;font-weight:bold;color:#d32f2f}.controls{display:flex;gap:10px}.plus,.minus{border:none;border-radius:8px;color:#fff;font-size:26px;min-width:90px;min-height:60px}.plus{background:#2e7d32}.minus{background:#c62828}#totale{margin-top:30px;font-size:32px;font-weight:bold}.buttons{margin-top:25px}.reset,.report{padding:14px 24px;border:none;border-radius:8px;color:#fff}.reset{background:#f57c00}.report{background:#1976d2}</style></head><body><h1>Conteggio Errori Pallavolo</h1><div class="info-partita"><div class="campo"><label>Data Partita</label><input type="date" id="dataPartita"></div><div class="campo"><label>Categoria</label><input id="categoria"></div><div class="campo"><label>Luogo</label><input id="luogo"></div><div class="campo"><label>Squadra Casa</label><input id="squadraCasa"></div><div class="campo"><label>Squadra Ospite</label><input id="squadraOspite"></div></div><div class="container"><div class="counter"><h2>Battuta</h2><div class="value" id="battuta">0</div><div class="controls"><button class="plus" onclick="modifica('battuta',1)">+</button><button class="minus" onclick="modifica('battuta',-1)">-</button></div></div><div class="counter"><h2>Difesa</h2><div class="value" id="difesa">0</div><div class="controls"><button class="plus" onclick="modifica('difesa',1)">+</button><button class="minus" onclick="modifica('difesa',-1)">-</button></div></div><div class="counter"><h2>Palleggio</h2><div class="value" id="palleggio">0</div><div class="controls"><button class="plus" onclick="modifica('palleggio',1)">+</button><button class="minus" onclick="modifica('palleggio',-1)">-</button></div></div><div class="counter"><h2>Attacco</h2><div class="value" id="attacco">0</div><div class="controls"><button class="plus" onclick="modifica('attacco',1)">+</button><button class="minus" onclick="modifica('attacco',-1)">-</button></div></div><div class="counter"><h2>Ricezione</h2><div class="value" id="ricezione">0</div><div class="controls"><button class="plus" onclick="modifica('ricezione',1)">+</button><button class="minus" onclick="modifica('ricezione',-1)">-</button></div></div><div class="counter"><h2>Muro</h2><div class="value" id="muro">0</div><div class="controls"><button class="plus" onclick="modifica('muro',1)">+</button><button class="minus" onclick="modifica('muro',-1)">-</button></div></div></div><div id="totale">Totale Errori: 0</div><div class="buttons"><button class="reset" onclick="resetContatori()">Azzera Tutto</button><button class="report" onclick="generaReport()">Genera Report TXT</button></div><script>const contatori=['battuta','difesa','palleggio','attacco','ricezione','muro'];function salva(){let d={};contatori.forEach(i=>d[i]=document.getElementById(i).textContent);['dataPartita','categoria','luogo','squadraCasa','squadraOspite'].forEach(i=>d[i]=document.getElementById(i).value);localStorage.setItem('erroriPallavolo',JSON.stringify(d));}function carica(){let d=JSON.parse(localStorage.getItem('erroriPallavolo')||'null');if(!d)return;contatori.forEach(i=>document.getElementById(i).textContent=d[i]||0);['dataPartita','categoria','luogo','squadraCasa','squadraOspite'].forEach(i=>document.getElementById(i).value=d[i]||'');agg();}function modifica(id,x){let v=parseInt(document.getElementById(id).textContent)+x;if(v<0)v=0;document.getElementById(id).textContent=v;agg();salva();}function agg(){let t=0;contatori.forEach(i=>t+=parseInt(document.getElementById(i).textContent));document.getElementById('totale').textContent='Totale Errori: '+t;}function resetContatori(){if(confirm('Azzerare tutti i dati?')){contatori.forEach(i=>document.getElementById(i).textContent='0');agg();salva();}}function generaReport(){let r='REPORT ERRORI PALLAVOLO

';contatori.forEach(i=>r+=i+': '+document.getElementById(i).textContent+'
');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'text/plain'}));a.download='Report_Errori_Pallavolo.txt';a.click();}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',salva));carica();</script></body></html>

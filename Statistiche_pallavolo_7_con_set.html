<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conteggio Errori Pallavolo</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:15px;
    text-align:center;
}

h1{
    color:#333;
}

.info-partita{
    max-width:1000px;
    margin:0 auto 20px;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.campo{
    display:flex;
    flex-direction:column;
    text-align:left;
}

.campo input{
    padding:10px;
}

.set-selector{
    margin:20px auto;
    font-size:20px;
}

.set-selector select{
    padding:8px;
    font-size:18px;
}

.container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    max-width:900px;
    margin:auto;
}

.counter{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;

    min-height:240px;
}

.value{
    font-size:56px;
    font-weight:bold;
    color:#d32f2f;
}

.controls{
    display:flex;
    gap:10px;
}

.plus,
.minus{
    border:none;
    border-radius:8px;
    color:#fff;
    font-size:26px;
    min-width:90px;
    min-height:60px;
    cursor:pointer;
}

.plus{
    background:#2e7d32;
}

.minus{
    background:#c62828;
}

#totale{
    margin-top:30px;
    font-size:32px;
    font-weight:bold;
}

.buttons{
    margin-top:25px;
}

.reset,
.report{
    padding:14px 24px;
    border:none;
    border-radius:8px;
    color:#fff;
    cursor:pointer;
}

.reset{
    background:#f57c00;
}

.report{
    background:#1976d2;
}

.riepilogo{
    margin-top:40px;
}

.riepilogo table{
    margin:auto;
    border-collapse:collapse;
    background:white;
}

.riepilogo th,
.riepilogo td{
    border:1px solid #ccc;
    padding:10px;
}

.riepilogo th{
    background:#eaeaea;
}

</style>
</head>

<body>

<h1>Conteggio Errori Pallavolo</h1>

<div class="info-partita">

    <div class="campo">
        <label>Data Partita</label>
        <input type="date" id="dataPartita">
    </div>

    <div class="campo">
        <label>Categoria</label>
        <input id="categoria">
    </div>

    <div class="campo">
        <label>Luogo</label>
        <input id="luogo">
    </div>

    <div class="campo">
        <label>Squadra Casa</label>
        <input id="squadraCasa">
    </div>

    <div class="campo">
        <label>Squadra Ospite</label>
        <input id="squadraOspite">
    </div>

</div>

<div class="set-selector">

    <strong>Set Corrente:</strong>

    <select id="setCorrente">
        <option value="0">1° Set</option>
        <option value="1">2° Set</option>
        <option value="2">3° Set</option>
        <option value="3">4° Set</option>
        <option value="4">5° Set</option>
    </select>

</div>

<div class="container">

    <div class="counter">
        <h2>Battuta</h2>
        <div class="value" id="battuta">0</div>

        <div class="controls">
            <button class="plus" onclick="modifica('battuta',1)">+</button>
            <button class="minus" onclick="modifica('battuta',-1)">-</button>
        </div>
    </div>

    <div class="counter">
        <h2>Difesa</h2>
        <div class="value" id="difesa">0</div>

        <div class="controls">
            <button class="plus" onclick="modifica('difesa',1)">+</button>
            <button class="minus" onclick="modifica('difesa',-1)">-</button>
        </div>
    </div>

    <div class="counter">
        <h2>Palleggio</h2>
        <div class="value" id="palleggio">0</div>

        <div class="controls">
            <button class="plus" onclick="modifica('palleggio',1)">+</button>
            <button class="minus" onclick="modifica('palleggio',-1)">-</button>
        </div>
    </div>

    <div class="counter">
        <h2>Attacco</h2>
        <div class="value" id="attacco">0</div>

        <div class="controls">
            <button class="plus" onclick="modifica('attacco',1)">+</button>
            <button class="minus" onclick="modifica('attacco',-1)">-</button>
        </div>
    </div>

    <div class="counter">
        <h2>Ricezione</h2>
        <div class="value" id="ricezione">0</div>

        <div class="controls">
            <button class="plus" onclick="modifica('ricezione',1)">+</button>
            <button class="minus" onclick="modifica('ricezione',-1)">-</button>
        </div>
    </div>

    <div class="counter">
        <h2>Muro</h2>
        <div class="value" id="muro">0</div>

        <div class="controls">
            <button class="plus" onclick="modifica('muro',1)">+</button>
            <button class="minus" onclick="modifica('muro',-1)">-</button>
        </div>
    </div>

</div>

<div id="totale">
    Totale Errori: 0
</div>

<div class="buttons">

    <button class="reset" onclick="resetContatori()">
        Azzera Tutto
    </button>

    <button class="report" onclick="generaReport()">
        Genera Report TXT
    </button>

</div>

<div class="riepilogo">

    <h2>Riepilogo Errori per Set</h2>

    <table>

        <thead>
            <tr>
                <th>Fondamentale</th>
                <th>1° Set</th>
                <th>2° Set</th>
                <th>3° Set</th>
                <th>4° Set</th>
                <th>5° Set</th>
            </tr>
        </thead>

        <tbody id="riepilogoSet">
        </tbody>

    </table>

</div>

<script>

const contatori = [
    "battuta",
    "difesa",
    "palleggio",
    "attacco",
    "ricezione",
    "muro"
];

const erroriPerSet = {
    battuta:[0,0,0,0,0],
    difesa:[0,0,0,0,0],
    palleggio:[0,0,0,0,0],
    attacco:[0,0,0,0,0],
    ricezione:[0,0,0,0,0],
    muro:[0,0,0,0,0]
};

function modifica(id,variazione){

    const setCorrente =
        parseInt(
            document.getElementById("setCorrente").value
        );

    erroriPerSet[id][setCorrente] += variazione;

    if(erroriPerSet[id][setCorrente] < 0){
        erroriPerSet[id][setCorrente] = 0;
    }

    const totaleFondamentale =
        erroriPerSet[id]
        .reduce((a,b)=>a+b,0);

    document.getElementById(id).textContent =
        totaleFondamentale;

    aggiornaTotale();
}

function aggiornaTotale(){

    let totale = 0;

    contatori.forEach(id=>{

        totale += erroriPerSet[id]
        .reduce((a,b)=>a+b,0);

    });

    document.getElementById("totale").textContent =
        "Totale Errori: " + totale;

    aggiornaTabellaSet();
}

function aggiornaTabellaSet(){

    let html = "";

    contatori.forEach(nome=>{

        html += `
        <tr>
            <td>${nome}</td>
            <td>${erroriPerSet[nome][0]}</td>
            <td>${erroriPerSet[nome][1]}</td>
            <td>${erroriPerSet[nome][2]}</td>
            <td>${erroriPerSet[nome][3]}</td>
            <td>${erroriPerSet[nome][4]}</td>
        </tr>
        `;
    });

    document.getElementById("riepilogoSet").innerHTML =
        html;
}

function resetContatori(){

    if(!confirm("Azzerare tutti i dati?")){
        return;
    }

    contatori.forEach(nome=>{

        erroriPerSet[nome] = [0,0,0,0,0];

        document.getElementById(nome).textContent = 0;
    });

    aggiornaTotale();
}

function generaReport(){

    let report =
        "REPORT ERRORI PALLAVOLO\n\n";

    report +=
        "Data: " +
        document.getElementById("dataPartita").value +
        "\n";

    report +=
        "Categoria: " +
        document.getElementById("categoria").value +
        "\n";

    report +=
        "Luogo: " +
        document.getElementById("luogo").value +
        "\n";

    report +=
        "Casa: " +
        document.getElementById("squadraCasa").value +
        "\n";

    report +=
        "Ospite: " +
        document.getElementById("squadraOspite").value +
        "\n\n";

    contatori.forEach(nome=>{

        report +=
            nome.toUpperCase() +
            " -> " +
            erroriPerSet[nome].join(" | ") +
            "\n";

    });

    const blob =
        new Blob([report],{
            type:"text/plain"
        });

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "Report_Errori_Pallavolo.txt";

    link.click();
}

aggiornaTotale();

</script>

</body>
</html>
